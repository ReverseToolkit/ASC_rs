[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/MG1937/ASC"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
memmap2 = "0.9"
regex = "1.11"
thiserror = "2.0.21"
asc-dex = { path = "crates/asc-dex" }
asc-axml = { path = "crates/asc-axml" }
asc-apk = { path = "crates/asc-apk" }
asc-abc = { path = "crates/asc-abc" }
asc-hap = { path = "crates/asc-hap" }
asc-diff = { path = "crates/asc-diff" }
asc-so = { path = "crates/asc-so" }
ddc-dec = "0.1.24"
ddc-dex = "0.2.5"
